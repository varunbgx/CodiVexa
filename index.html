<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codivexa LMS - Launchpad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf9ff;
            color: #051a3e;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-white border border-slate-200 rounded-3xl p-8 shadow-xl text-center space-y-6">
        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 animate-bounce">
            <span class="material-symbols-outlined text-4xl">rocket_launch</span>
        </div>
        
        <div>
            <h1 class="text-3xl font-extrabold text-blue-700">Codivexa LMS</h1>
            <p class="text-sm text-slate-500 mt-2">Professional Course Certifications & Learning Platform</p>
        </div>

        <div class="bg-slate-50 p-4 rounded-xl text-xs text-slate-600 flex items-center justify-center gap-2 border border-slate-100">
            <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-ping"></span>
            Redirecting to landing page in <span id="countdown" class="font-bold">3</span> seconds...
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-4">
            <a href="./stitch_motion_learning_platform/codivexa_landing_page/code.html" class="flex items-center justify-between p-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md transition-all active:scale-95 font-semibold text-sm">
                <span>Codivexa Landing Page</span>
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
            </a>
            <a href="./stitch_motion_learning_platform/course_catalog/code.html" class="flex items-center justify-between p-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all active:scale-95 text-sm font-semibold border border-slate-200">
                <span>Course Catalog</span>
                <span class="material-symbols-outlined text-sm">explore</span>
            </a>
            <a href="./stitch_motion_learning_platform/student_dashboard/code.html" class="flex items-center justify-between p-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all active:scale-95 text-sm font-semibold border border-slate-200">
                <span>Student Dashboard</span>
                <span class="material-symbols-outlined text-sm">dashboard</span>
            </a>
            <a href="./stitch_motion_learning_platform/admin_panel/code.html" class="flex items-center justify-between p-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all active:scale-95 text-sm font-semibold border border-slate-200">
                <span>Admin Panel</span>
                <span class="material-symbols-outlined text-sm">admin_panel_settings</span>
            </a>
        </div>
    </div>

    <script>
        let count = 3;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            count--;
            countdownEl.textContent = count;
            if (count <= 0) {
                clearInterval(timer);
                window.location.href = "./stitch_motion_learning_platform/codivexa_landing_page/code.html";
            }
        }, 1000);
    </script>
</body>
</html>
